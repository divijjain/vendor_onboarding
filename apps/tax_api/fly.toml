app = "document-compliance-tax-api"
primary_region = "iad"

[build]

[env]
  PORT = "8080"

# Internal tool server only — reached over Fly's private 6PN network at
# document-compliance-tax-api.internal:8080 by document-compliance-engine,
# never meant to be a public product endpoint. This app is still assigned
# a public *.fly.dev URL by default (Fly's minimum), but nothing links to
# it; min_machines_running = 1 keeps it always warm since a cold-started
# MCP tool call mid-pipeline-run would otherwise add real latency.
[http_service]
  internal_port = 8080
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
